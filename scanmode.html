<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="plotly.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      #plotly-3d-heatmap,
      #plotly-2d-heatmap {
        width: 100vw;
        height: 100vh;
        display: none; /* Başlangıçta grafikler gizlenir */
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 100;
      }
      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 16px;
        display: none;
      }
      button {
        margin: 5px;
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button onclick="show3D()">3D Görünüm</button>
      <button onclick="show2D()">2D Görünüm</button>
    </div>

    <div id="plotly-3d-heatmap"></div>
    <div id="plotly-2d-heatmap"></div>
    <div id="message">Hazırlanıyor...</div>

    <script>
      let xyz = []; // Başlangıçta boş

      function normalizeZValues(data) {
      // Z değerlerini alırken 0 olmayanları filtreliyoruz
      const zValues = data.map(point => point.z).filter(z => z !== 0);

      console.log("Filtered Z Values (0 olmayanlar):", zValues); // Z = 0 olmayan değerler

      if (zValues.length === 0 || Math.max(...zValues) === Math.min(...zValues)) {
        console.error("Z değerleri normalizasyon için uygun değil.");
        return data; // Değiştirmeden geri döndürüyoruz
      }

      const minZ = Math.min(...zValues);
      const maxZ = Math.max(...zValues);

      if (minZ === maxZ) {
        console.warn("Z değerleri normalizasyon için uygun değil:", minZ, maxZ);
        return data; // Değiştirmeden geri döndürüyoruz
      }

      const normalizedData = data.map(point => ({
        ...point,
        // Z = 0 olan değerleri normalizasyona dahil etmiyoruz
        z: point.z === 0 ? 0 : (point.z - minZ) / (maxZ - minZ) // Normalizasyon işlemi
      }));

      // Normalized z değerlerini konsola yazdır
      console.log("Normalized Z Values:", normalizedData.map(point => point.z));

      return normalizedData;
    }

      // 3D görünümü göster ve 2D görünümü gizle
      function show3D() {
        document.getElementById("plotly-3d-heatmap").style.display = "block";
        document.getElementById("plotly-2d-heatmap").style.display = "none";
        render3DSurface(xyz);
      }

      // 2D görünümü göster ve 3D görünümü gizle
      function show2D() {
        document.getElementById("plotly-2d-heatmap").style.display = "block";
        document.getElementById("plotly-3d-heatmap").style.display = "none";
        render2DHeatmap(xyz);
      }

      // 3D grafiği oluşturma
      function render3DSurface(data) {
        const messageElement = document.getElementById("message");
        const plotlyElement = document.getElementById("plotly-3d-heatmap");

        if (data.length === 0) {
          messageElement.style.display = "block";
          plotlyElement.style.display = "none";
          return;
        } else {
          messageElement.style.display = "none";
          plotlyElement.style.display = "block";
        }

        const normalizedData = normalizeZValues(data);

        const xRange = Array.from(
          new Set(normalizedData.map((point) => point.x))
        ).sort((a, b) => a - b);
        const yRange = Array.from(
          new Set(normalizedData.map((point) => point.y))
        ).sort((a, b) => a - b);

        const x = [];
        const y = [];
        const z = [];

        xRange.forEach((xVal) => {
          x.push(xVal);
          y.push(yRange.map((yVal) => yVal));
          z.push(
            yRange.map((yVal) => {
              const point = normalizedData.find(
                (p) => p.x === xVal && p.y === yVal
              );
              return point ? point.z : 0;
            })
          );
        });

        const trace3D = {
          z: z,
          x: x[0],
          y: y.flat(),
          type: "surface",
          showscale: false,
          colorscale: [
            [0, "blue"],
            [0.4, "aqua"],
            [0.5, "darkgreen"],
            [0.55, "green"],
            [0.7, "limegreen"],
            [0.8, "yellowgreen"],
            [0.9, "orange"],
            [1, "red"],
          ],
          contours: {
            z: {
              show: true,
              highlightcolor: "red",
              project: { z: true },
            },
          },
        };

        Plotly.react(
          "plotly-3d-heatmap",
          [trace3D],
          {
            scene: {
              xaxis: { title: "X" },
              yaxis: { title: "Y" },
              zaxis: { title: "Z", range: [-5, 5] },
              camera: {
                eye: { x: 0, y: 0, z: 2.5 },
              },
            },
            margin: { l: 10, r: 10, b: 0, t: 0 },
          },
          {
            responsive: true,
            displayModeBar: false,
          }
        );
      }

      // 2D grafiği oluşturma
      function render2DHeatmap(data) {
        const plotlyElement = document.getElementById("plotly-2d-heatmap");

        if (data.length === 0) {
          plotlyElement.style.display = "none";
          return;
        } else {
          plotlyElement.style.display = "block";
        }

        const normalizedData = normalizeZValues(data);

        const xRange = Array.from(
          new Set(normalizedData.map((point) => point.x))
        ).sort((a, b) => a - b);
        const yRange = Array.from(
          new Set(normalizedData.map((point) => point.y))
        ).sort((a, b) => a - b);

        const x = xRange; // X ekseni
        const y = yRange; // Y ekseni
        const z = yRange.map((yVal) => {
          return xRange.map((xVal) => {
            const point = normalizedData.find(
              (p) => p.x === xVal && p.y === yVal
            );
            return point ? point.z : 0;
          });
        });
        const trace2D = {
  x: x,
  y: y,
  z: z,
  type: 'contour',
  showscale: false, // Renk ölçeğini gizlemek için
  contours: {
    coloring: 'heatmap', // Sadece ısı haritası, kontur çizgisi yok
    showlines: false, // Kontur çizgilerini kapatıyoruz
  },
  colorscale: [
            [0, "blue"],
            [0.4, "aqua"],
            [0.5, "darkgreen"],
            [0.55, "green"],
            [0.7, "limegreen"],
            [0.8, "yellowgreen"],
            [0.9, "orange"],
            [1, "red"],
          ],
  line: {
    width: 0, // Çizgi genişliğini sıfırlıyoruz (gizli çizgiler)
  },
};
        Plotly.react(
          "plotly-2d-heatmap",
          [trace2D],
          {
            xaxis: { title: "X" },
            yaxis: { title: "Y" },
            margin: { l: 50, r: 50, b: 50, t: 50 },
          },
          {
            responsive: true,
            displayModeBar: false,
          }
        );
      }

      // Mesaj alındığında aktif olan grafik güncellensin
      document.addEventListener("message", (event) => {
        const data = JSON.parse(event.data);
        if (data.values !== undefined) {
          xyz = data.values;
          // Aktif olan grafiği yeniden çiz
          if (document.getElementById("plotly-3d-heatmap").style.display === "block") {
            render3DSurface(data.values);
          } else if (document.getElementById("plotly-2d-heatmap").style.display === "block") {
            render2DHeatmap(data.values);
          }
        }
      });

      // Mesaj dinleyici (gelen veriyi işlemeye devam eder)
      window.addEventListener("message", (event) => {
        const data = JSON.parse(event.data);
        if (data.values !== undefined) {
          xyz = data.values;
          // Aktif olan grafiği yeniden çiz
          if (document.getElementById("plotly-3d-heatmap").style.display === "block") {
            render3DSurface(data.values);
          } else if (document.getElementById("plotly-2d-heatmap").style.display === "block") {
            render2DHeatmap(data.values);
          }
        }
      });
    </script>
  </body>
</html>
